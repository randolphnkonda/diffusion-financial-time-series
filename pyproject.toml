[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-financial-time-series"
version = "1.0.0"
description = "Score-based diffusion models (CSDI / VE-SDE) for generating financial return series, with a calibrated evaluation suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "torch",
    "matplotlib",
    "scikit-learn",
    "statsmodels",
    "yfinance",
]

[project.optional-dependencies]
notebooks = ["jupyter", "ipykernel"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "model*", "sampling*", "evaluation*", "plots*"]
